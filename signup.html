<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Create Account | CarleyNFitness</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/logoG.jpg" type="image/png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#708090" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CNFitness" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
</head>
<body class="portal-body">

  <!-- Hero -->
  <div class="portal-hero">
    <a href="index.html">
      <img src="images/logo.png" alt="CarleyNFitness" class="logo-sm" />
    </a>
    <h1>Create your account</h1>
    <p>Your personal fitness dashboard is waiting for you.</p>
  </div>

  <!-- Sign-up card -->
  <div class="portal-card">
    <h2>Let's get you set up</h2>
    <p class="sub">Once you're in, Carley will add your programme and goals to your dashboard.</p>

    <div class="portal-msg" id="signup-msg"></div>

    <form id="signup-form" novalidate>
      <label for="signup-email">Email address</label>
      <input type="email" id="signup-email" placeholder="you@email.com" required autocomplete="email" />

      <label for="signup-password">Choose a password</label>
      <input type="password" id="signup-password" placeholder="At least 6 characters" required autocomplete="new-password" />

      <button type="submit" class="btn-portal">Create account</button>
    </form>

    <div class="link-row">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
    <div class="link-row" style="margin-top: 10px;">
      <a href="index.html">&larr; Back to website</a>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpju8JIedURVxBJgmZ1yBuRzd4CEdFDVY",
    authDomain: "carleynfitnesscalendar.firebaseapp.com",
    projectId: "carleynfitnesscalendar",
    storageBucket: "carleynfitnesscalendar.appspot.com",
    messagingSenderId: "1013642078015",
    appId: "1:1013642078015:web:e8bcff9d1559f1c1d5158a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById("signup-form");
  const msgEl = document.getElementById("signup-msg");

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "portal-msg " + type + " show";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.className = "portal-msg";

    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;

    if (password.length < 6) {
      showMsg("Password needs to be at least 6 characters.", "error");
      return;
    }

    try {
      const credential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = credential.user.uid;

      // Create a blank client profile — Carley fills in the details via admin.html
      await setDoc(doc(db, "clients", uid), {
        email,
        fullName: "",
        goal: "",
        startDate: "",
        notes: "",
        calorieTarget: null,
        createdAt: new Date().toISOString()
      });

      showMsg("Account created! Heading to your dashboard...", "success");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
    } catch (err) {
      const messages = {
        "auth/email-already-in-use": "There is already an account with that email. Try logging in instead.",
        "auth/invalid-email":        "That email address doesn't look right.",
        "auth/weak-password":        "Password is too short — please use at least 6 characters."
      };
      showMsg(messages[err.code] || "Something went wrong. Please try again.", "error");
    }
  });
</script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
